<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>河事录 · 两岸试局</title><link rel="stylesheet" href="/src/trial/style.css">
<header><small>大运河　／　工程试局</small><h1>河事录</h1><p>南仓有粮，北岸待运。以两年为期，决定何时疏浚、如何征役。</p></header>
<main><section><h2 id="date"></h2><svg viewBox="0 0 560 135" role="img" aria-label="南仓经一段运河向北岸供粮，航程两旬"><path d="M65 80 Q180 0 270 65 T490 55" fill="none" stroke="#3d7986" stroke-width="10"/><circle cx="65" cy="80" r="9"/><circle cx="490" cy="55" r="9"/><text x="42" y="115">南仓</text><text x="467" y="92">北岸</text></svg>
<div id="metrics"></div><h2>河段工程</h2><label>疏浚规模 <select id="grade"><option value="small">小修</option><option value="standard">大修</option><option value="heavy">重修</option></select></label> <label>征役 <select id="mode"><option value="normal">常役</option><option value="urgent">加急</option></select></label><p id="estimate"></p><button id="plan">开工疏浚</button> <button id="pause">暂停工程</button> <button id="resume">复工</button>
<h2>通航</h2><button id="close">封航三旬</button> <button id="open">恢复通航</button></section>
<section><h2>祭祀与河报</h2><p id="prayer"></p><p id="project"></p><button id="step">推进一旬</button> <button id="advance">推进到关键节点</button><h2>实录</h2><ol id="history"></ol><button id="save">保存游戏</button> <button id="load">读取存档</button> <button id="reset">重新开局</button><p role="status" id="status"></p></section></main>
<footer>合成教学剧本 · 一年三十六旬 · 数值为游戏单位</footer><script type="module" src="/src/trial/app.js"></script></html>
